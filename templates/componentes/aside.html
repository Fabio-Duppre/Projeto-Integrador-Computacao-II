<aside class="hidden md:flex flex-col h-full p-md gap-xs border-r border-outline-variant bg-surface-container-low fixed left-0 top-0 w-[280px] shadow-sm z-40">
    <!-- Brand/Header -->
    <div class="flex items-center gap-sm mb-lg px-xs">
        <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shrink-0">
            <span class="material-symbols-outlined icon-fill">
                account_balance
            </span>
        </div>
        <div class="flex flex-col">
            <span class="font-headline-sm text-headline-sm text-primary">Gestão Educacional</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant">Painel de Controle</span>
        </div>
    </div>

    <!-- Main Nav Tabs -->    
    <nav class="flex-1 flex flex-col gap-base">
        <a class="  {% if request.endpoint == 'index' %}
                        flex items-center gap-sm px-sm py-sm bg-secondary-container text-on-secondary-container font-semibold rounded-lg scale-95 duration-150
                    {% else%}    
                        flex items-center gap-sm px-sm py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all scale-95 duration-150 rounded-lg
                    {% endif %}" href="{{ url_for('index') }}">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-label-md text-label-md">Index</span>
        </a>
        <a class="
                    {% if request.endpoint == 'municipios' %}
                        flex items-center gap-sm px-sm py-sm bg-secondary-container text-on-secondary-container font-semibold rounded-lg scale-95 duration-150
                    {% else%}    
                        flex items-center gap-sm px-sm py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all scale-95 duration-150 rounded-lg
                    {% endif %}" href="{{ url_for('municipios') }}">
            <span class="material-symbols-outlined">location_city</span>
            <span class="font-label-md text-label-md">Municípios</span>
        </a>
        <a class="
                    {% if request.endpoint == 'escolas' %}
                        flex items-center gap-sm px-sm py-sm bg-secondary-container text-on-secondary-container font-semibold rounded-lg scale-95 duration-150
                    {% else%}    
                        flex items-center gap-sm px-sm py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all scale-95 duration-150 rounded-lg
                    {% endif %}" href="{{ url_for('escolas') }}">
            <span class="material-symbols-outlined">school</span>
            <span class="font-label-md text-label-md">Escolas</span>
        </a>

        <!-- Active Tab -->
        <a class=" {% if request.endpoint == 'comparacao' %}
                        flex items-center gap-sm px-sm py-sm bg-secondary-container text-on-secondary-container font-semibold rounded-lg scale-95 duration-150
                    {% else%}    
                        flex items-center gap-sm px-sm py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all scale-95 duration-150 rounded-lg
                    {% endif %}" href="{{ url_for('comparacao') }}">
            <span class="material-symbols-outlined icon-fill">compare_arrows</span>
            <span class="font-label-md text-label-md">Comparação</span>
        </a>
    </nav>

    <!-- Footer Nav Tabs -->
    <div class="flex flex-col gap-base border-t border-outline-variant pt-sm mt-auto">
        <a class="flex items-center gap-sm px-sm py-sm text-on-surface-variant hover:bg-surface-container-highest transition-all scale-95 duration-150 rounded-lg" href="#">
            <span class="material-symbols-outlined">help</span>
            <span class="font-label-md text-label-md">Ajuda</span>
        </a>
    </div>
</aside>
